<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的第一個 GitHub Pages 網站</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-labelledby="site-title">
        <p class="eyebrow">GitHub Pages 練習</p>
        <h1 id="site-title">我的第一個基礎網站</h1>
        <p class="lead">
          這是一個用 HTML 和 CSS 製作的靜態網站，目標是學會把專案放到 GitHub，並透過 GitHub Pages 發布成公開網頁。
        </p>
        <div class="actions" aria-label="主要連結">
          <a class="button primary" href="https://docs.github.com/pages" target="_blank" rel="noreferrer">GitHub Pages 文件</a>
          <a class="button secondary" href="./docs/github-basic-website/00-index.md">查看學習紀錄</a>
        </div>
      </section>

      <section class="steps" aria-labelledby="steps-title">
        <h2 id="steps-title">這次要學會的事</h2>
        <ol>
          <li>建立最基本的網站檔案。</li>
          <li>把資料夾初始化成 Git 專案。</li>
          <li>推送到 GitHub repository。</li>
          <li>開啟 GitHub Pages，讓網站可以用網址瀏覽。</li>
        </ol>
      </section>
    </main>
  </body>
</html>
